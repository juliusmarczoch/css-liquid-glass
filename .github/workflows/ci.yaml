name: CI

# Pull requests (forks included) and every branch except main. No secrets and
# read-only rights: this workflow can check, never deploy. main is covered by
# the `verify` job in deploy-production.yaml, which gates the deploy.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and build
        run: npm run build

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/overlays/prod > /dev/null
