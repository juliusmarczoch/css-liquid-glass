# studies.nordify.io: the study lives under /study/001-liquid-glass/, the bare
# domain points to nordify.io until there is an overview page.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Relative Location headers: behind Traefik nginx does not know the public
  # host and port.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = / {
    return 302 https://nordify.io/;
  }

  location = /study/001-liquid-glass {
    return 301 /study/001-liquid-glass/;
  }

  # Hashed build output: never changes under the same name.
  location /study/001-liquid-glass/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # add_header in a location replaces the server-level ones, so all here.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=300" always;
    # add_header in a location replaces the server-level ones, so all here.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
