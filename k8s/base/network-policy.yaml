apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: liquid-glass-ingress
  namespace: liquid-glass
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: liquid-glass
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8080
          protocol: TCP
